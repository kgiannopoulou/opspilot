name: opspilot

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot
      POSTGRES_DB: opspilot
    ports:
      - "5438:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot -d opspilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    env_file: .env.example
    environment:
      OPSPILOT_DATABASE_URL: postgresql+psycopg://opspilot:opspilot@postgres:5432/opspilot
      OPSPILOT_REDIS_URL: redis://redis:6379/0
    ports:
      - "8010:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Background jobs (AI triage, investigations) from the Redis stream. Scale with: docker compose up --scale worker=3
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    env_file: .env.example
    environment:
      OPSPILOT_DATABASE_URL: postgresql+psycopg://opspilot:opspilot@postgres:5432/opspilot
      OPSPILOT_REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.workers.main"]
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy  # the API container applies migrations and seeds on start
    stop_grace_period: 30s  # lets the current job finish (SIGTERM is handled)

  web:
    build:
      context: frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
    ports:
      - "3010:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
