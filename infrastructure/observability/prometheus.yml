# docker compose --profile observability up -d   →   Prometheus http://localhost:9095 · Grafana http://localhost:3011
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: opspilot-api
    metrics_path: /metrics
    # With OPSPILOT_METRICS_TOKEN set on the API, add:  authorization: { credentials: <token> }
    static_configs:
      - targets: ["api:8000"]

  - job_name: opspilot-worker
    # docker compose resolves "worker" to every replica (--scale worker=3); each exposes its own job counters.
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9101
